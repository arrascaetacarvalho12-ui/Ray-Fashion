<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Feminino - Ray Fashion</title>
<style>
body{background:#f5f0ff;color:#2d2a6e;font-family:Arial;text-align:center;margin:0}
header{background:#2d2a6e;color:white;padding:20px}
.menu{display:flex;justify-content:center;gap:10px;padding:15px;flex-wrap:wrap}
.menu a{background:white;color:#2d2a6e;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:bold;border:2px solid #2d2a6e}
.menu a.ativo{background:#2d2a6e;color:white}
.search-box{max-width:500px;margin:10px auto;display:flex;gap:8px;padding:0 15px}
.search-box input{flex:1;padding:12px;border:none;border-radius:20px;outline:none}
.search-box button{background:#a78bfa;color:white;border:none;padding:12px 18px;border-radius:20px;font-weight:bold;cursor:pointer}
.produtos{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:20px}
.produto{background:white;border-radius:15px;padding:15px;width:215px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
.produto img{width:100%;height:200px;object-fit:cover;border-radius:10px}
.tamanhos{display:flex;justify-content:center;gap:5px;margin:8px 0}
.tamanhos button{background:#eee;border:1px solid #ccc;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:bold}
.tamanhos button.selecionado{background:#2d2a6e;color:white}
.comprar{background:#2d2a6e;color:white;border:none;padding:10px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%}
</style>
</head>
<body>
<header><h1>RAY FASHION ✨</h1><p>👗 Coleção Feminina</p>
<div class="search-box"><input id="pesquisa" placeholder="🔍 Pesquisar... ex: vestido" onkeyup="pesquisar()"><button onclick="pesquisar()">Buscar</button></div>
<p id="contador" style="background:white;color:#2d2a6e;display:inline-block;padding:6px 14px;border-radius:20px;font-weight:bold;margin-top:10px;">🛒 Carrinho: 0 - R$ 0,00</p>
</header>
<nav class="menu"><a href="index.html">🏠 Início</a><a href="feminino.html" class="ativo">👗 Feminino</a><a href="masculino.html">👕 Masculino</a><a href="acessorios.html">👜 Acessórios</a></nav>
<p id="nenhum" style="display:none;">😢 Nenhuma roupa encontrada</p>
<div class="produtos">
<div class="produto" data-nome="vestido florido"><img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"><h3>Vestido Florido</h3><p><b>R$ 119,90</b></p><div class="tamanhos"><button onclick="selecionarTam(this)">P</button><button onclick="selecionarTam(this)">M</button><button class="selecionado" onclick="selecionarTam(this)">G</button><button onclick="selecionarTam(this)">GG</button></div><button class="comprar" onclick="adicionarCarrinho(this,'Vestido Florido',119.90)">Comprar</button></div>
<div class="produto" data-nome="saia midi plissada"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400"><h3>Saia Midi Plissada</h3><p><b>R$ 79,90</b></p><div class="tamanhos"><button onclick="selecionarTam(this)">P</button><button class="selecionado" onclick="selecionarTam(this)">M</button><button onclick="selecionarTam(this)">G</button><button onclick="selecionarTam(this)">GG</button></div><button class="comprar" onclick="adicionarCarrinho(this,'Saia Midi Plissada',79.90)">Comprar</button></div>
<div class="produto" data-nome="blusa cropped"><img src="https://images.unsplash.com/photo-1583496661160-fb5886a13d44?w=400"><h3>Blusa Cropped</h3><p><b>R$ 59,90</b></p><div class="tamanhos"><button class="selecionado" onclick="selecionarTam(this)">P</button><button onclick="selecionarTam(this)">M</button><button onclick="selecionarTam(this)">G</button><button onclick="selecionarTam(this)">GG</button></div><button class="comprar" onclick="adicionarCarrinho(this,'Blusa Cropped',59.90)">Comprar</button></div>
<div class="produto" data-nome="calça wide leg"><img src="https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=400"><h3>Calça Wide Leg</h3><p><b>R$ 99,90</b></p><div class="tamanhos"><button onclick="selecionarTam(this)">P</button><button onclick="selecionarTam(this)">M</button><button class="selecionado" onclick="selecionarTam(this)">G</button><button onclick="selecionarTam(this)">GG</button></div><button class="comprar" onclick="adicionarCarrinho(this,'Calça Wide Leg',99.90)">Comprar</button></div>
</div>
<div style="background:white;max-width:600px;margin:20px auto;padding:20px;border-radius:15px;"><h2>🛒 Meu Carrinho</h2><ul id="lista-carrinho" style="list-style:none;"></ul><p id="total"><b>Total: R$ 0,00</b></p><button onclick="finalizarCompra()" style="background:#22c55e;color:white;border:none;padding:12px 25px;border-radius:10px;font-weight:bold;cursor:pointer;">Finalizar Compra</button></div>
<script src="script.js"></script>
</body>
</html>
